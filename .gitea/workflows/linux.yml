name: Clang Format

on:
  push:
    branches:
      - master
    paths-ignore:
      - "docs/**"
      - "scripts/**"
      - "LICENSE.md"
      - "README.md"
  pull_request:
    branches:
      - master
    paths-ignore:
      - "docs/**"
      - "scripts/**"
      - "LICENSE.md"
      - "README.md"

  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-vanilla-stonking
    env:
      GCC_VERSION: 16
      LLVM_VERSION: 22

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install GCC & Clang
        run: |
          apt-get update
          apt-get install -y g++-${{ env.GCC_VERSION }} clang-${{ env.LLVM_VERSION }}
          ln -sf "$(command -v clang-${{ env.LLVM_VERSION }})" /usr/local/bin/clang

          gcc-16 -v
          clang -v

      - name: Setup Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Compile with GCC
        run: |
          XMAKE_ROOT=y xmake f -c -p linux --toolchain=gcc-16
          XMAKE_ROOT=y xmake -rv

      - name: Compile with Clang
        run: |
          XMAKE_ROOT=y xmake f -c -p linux --toolchain=clang
          XMAKE_ROOT=y xmake -rv
