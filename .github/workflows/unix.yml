name: BSD & Unix

on:
  push:
    branches:
      - master
    paths-ignore:
      - "docs/**"
      - "scripts/**"
      - "LICENSE.md"
      - "README.md"
  pull_request:
    branches:
      - master
    paths-ignore:
      - "docs/**"
      - "scripts/**"
      - "LICENSE.md"
      - "README.md"

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  freebsd:
    name: FreeBSD
    runs-on: ubuntu-latest
    if: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build & run in FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg install -y git gmake devel/llvm21 readline curl bash
            curl -fsSL https://xmake.io/shget.text | bash || true
          run: |
            set -e
            export PATH="$HOME/.local/bin:$PATH"
            export XMAKE_ROOT=y
            clang21 -v
            xmake f -c -p cross --cross=x86_64-unknown-freebsd --toolchain=clang --cc=clang21 --cxx=clang++21 --ld=clang++21 --ar=llvm-ar21
            xmake -rv
            xmake run

  openbsd:
    name: OpenBSD
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build & run in OpenBSD VM
        uses: vmactions/openbsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg_add git gmake llvm21 readline bash curl
            curl -fsSL https://xmake.io/shget.text | bash || true
          run: |
            set -e
            echo "=== Checking environment ==="
            whoami
            pwd
            ls -la
            . ~/.xmake/profile 2>/dev/null || true
            export PATH="$HOME/.local/bin:$PATH"
            export XMAKE_ROOT=y
            echo "=== Checking clang ==="
            which clang
            clang -v
            echo "=== Checking clang21 ==="
            which clang21
            clang21 -v
            echo "=== Configuring xmake ==="
            xmake f -c -p cross --cross=x86_64-unknown-openbsd --toolchain=clang--cc=clang21 --cxx=clang++21 --ld=clang++21 --ar=llvm-ar21
            echo "=== Building ==="
            xmake -rv
            echo "=== Running ==="
            xmake run

  netbsd:
    name: NetBSD
    runs-on: ubuntu-latest
    if: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build & run in NetBSD VM
        uses: vmactions/netbsd-vm@v1
        with:
          usesh: true
          prepare: |
            /usr/sbin/pkg_add -v git gmake gcc16 clang readline bash curl
            curl -fsSL https://xmake.io/shget.text | bash || true
          run: |
            set -e
            . ~/.xmake/profile 2>/dev/null || true
            export PATH="$HOME/.local/bin:$PATH"
            clang -v
            xmake f -c -p cross --cross=x86_64-unknown-netbsd --toolchain=clang
            xmake -rv
            xmake run

  dragonfly:
    name: DragonFly BSD
    runs-on: ubuntu-latest
    if: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build & run in DragonFly BSD VM
        uses: vmactions/dragonflybsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg install -y git gmake readline curl bash llvm
            curl -fsSL https://xmake.io/shget.text | bash || true
          run: |
            set -e
            . ~/.xmake/profile 2>/dev/null || true
            export PATH="$HOME/.local/bin:$PATH"
            clang -v
            xmake f -c -p cross --cross=x86_64-unknown-dragonfly --toolchain=clang
            xmake -rv
            xmake run

  openindiana:
    name: OpenIndiana
    runs-on: ubuntu-latest
    if: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build & run in OpenIndiana VM
        uses: vmactions/openindiana-vm@v1
        with:
          usesh: true
          prepare: |
            pkg install build-essential pkg:/developer/clang-18 pkg:/shell/bash pkg:/network/curl
            curl -fsSL https://xmake.io/shget.text | bash || true
          run: |
            set -e
            . ~/.xmake/profile 2>/dev/null || true
            export PATH="$HOME/.local/bin:$PATH"
            clang -v
            xmake f -c -p cross --cross=x86_64-pc-solaris2.11 --toolchain=clang
            xmake -rv
            xmake run
