name: BSD & Unix

on:
  push:
    branches:
      - master
    paths-ignore:
      - "docs/**"
      - "scripts/**"
      - "LICENSE.md"
      - "README.md"
  pull_request:
    branches:
      - master
    paths-ignore:
      - "docs/**"
      - "scripts/**"
      - "LICENSE.md"
      - "README.md"

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  freebsd:
    name: FreeBSD
    runs-on: ubuntu-latest
    if: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build & run in FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg install -y git gmake devel/llvm21 readline curl bash
            curl -fsSL https://xmake.io/shget.text | bash || true
          run: |
            set -e
            export PATH="$HOME/.local/bin:$PATH"
            export XMAKE_ROOT=y
            clang21 -v
            xmake f -c -p cross --cross=x86_64-unknown-freebsd12.3 --toolchain=clang --cc=clang21 --cxx=clang++21 --ld=clang++21 --ar=llvm-ar21
            xmake -rv
            echo "=== Running ==="
            file build/cross/x86_64/debug/ib_app
            readelf -h build/cross/x86_64/debug/ib_app
            xmake run

  openbsd:
    name: OpenBSD
    runs-on: ubuntu-latest
    if: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build & run in OpenBSD VM
        uses: vmactions/openbsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg_add git gmake llvm%21 readline bash curl
            curl -fsSL https://xmake.io/shget.text | bash || true
          run: |
            set -e
            echo "=== Checking environment ==="
            whoami
            pwd
            ls -la

            export PATH="$HOME/.local/bin:$PATH"
            export XMAKE_ROOT=y

            echo "=== Checking clang ==="
            which clang
            clang -v
            echo "=== Checking clang21 ==="
            which clang-21 || echo "clang-21 not found"
            clang-21 -v
            echo "=== Configuring xmake ==="
            xmake f -c -p cross --cross=x86_64-unknown-openbsd7.9 --toolchain=clang --cc=clang-21 --cxx=clang++-21 --ld=clang++ --ar=llvm-ar-21 --ldflags=-fuse-ld=lld
            echo "=== Building ==="
            xmake -rv
            echo "=== Running ==="
            file build/cross/x86_64/debug/ib_app
            readelf -h build/cross/x86_64/debug/ib_app
            chmod +x build/cross/x86_64/debug/ib_app
            # ./build/cross/x86_64/debug/ib_app


  netbsd:
    name: NetBSD
    runs-on: ubuntu-latest
    if: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build & run in NetBSD VM
        uses: vmactions/netbsd-vm@v1
        with:
          usesh: true
          prepare: |
            /usr/sbin/pkg_add -v git gmake clang readline bash curl
            curl -fsSL https://xmake.io/shget.text | bash || true
          run: |
            set -e
            echo "=== Checking environment ==="
            whoami
            pwd
            ls -la

            export PATH="$HOME/.local/bin:$PATH"
            export XMAKE_ROOT=y

            echo "=== Checking clang ==="
            which clang
            clang -v
            echo "=== Checking clang21 ==="
            which clang-21 || echo "clang-21 not found"
            clang-21 -v
            echo "=== Configuring xmake ==="
            xmake f -vD -c -p cross --cross=x86_64-unknown-netbsd8.0 --toolchain=clang --cc=clang-21 --cxx=clang++ --ld=clang++ --ar=llvm-ar
            echo "=== Building ==="
            xmake -rv
            echo "=== Running ==="
            file build/cross/x86_64/debug/ib_app
            readelf -h build/cross/x86_64/debug/ib_app
            chmod +x build/cross/x86_64/debug/ib_app
            ./build/cross/x86_64/debug/ib_app

  dragonfly:
    name: DragonFly BSD
    runs-on: ubuntu-latest
    if: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build & run in DragonFly BSD VM
        uses: vmactions/dragonflybsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg install -y git gmake devel/llvm21 readline curl bash
            curl -fsSL https://xmake.io/shget.text | sh || true
          run: |
            set -e
            export PATH="$HOME/.local/bin:$PATH"
            clang -v
            xmake f -vD -c -p cross --cross=x86_64-unknown-dragonfly4.6 --toolchain=clang
            xmake -rv
            xmake run

  openindiana:
    name: OpenIndiana
    runs-on: ubuntu-latest
    if: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build & run in OpenIndiana VM
        uses: vmactions/openindiana-vm@v1
        with:
          usesh: true
          prepare: |
            pkg install build-essential pkg:/developer/clang-18 pkg:/shell/bash pkg:/network/curl
            curl -fsSL https://xmake.io/shget.text | bash || true
          run: |
            set -e
            export PATH="$HOME/.local/bin:$PATH"
            clang -v
            xmake f -c -p cross --cross=x86_64-pc-solaris2.11 --toolchain=clang
            xmake -rv
            xmake run
